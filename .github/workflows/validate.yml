name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scorer
        run: python3 -m py_compile analyze-gold-outlook/scripts/score_gold_outlook.py
      - name: Run regression test
        run: python3 analyze-gold-outlook/scripts/test_score_gold_outlook.py
      - name: Check required skill metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("analyze-gold-outlook/SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n")
          frontmatter = text.split("---", 2)[1]
          assert "name: analyze-gold-outlook" in frontmatter
          assert "description:" in frontmatter
          print("metadata ok")
          PY
      - name: Check explanation and technical-analysis contracts
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("analyze-gold-outlook")
          skill = (root / "SKILL.md").read_text(encoding="utf-8")
          template = (root / "references/output-template.md").read_text(encoding="utf-8")
          agents = Path("AGENTS.md").read_text(encoding="utf-8")
          signals = json.loads((root / "scripts/example_signals.json").read_text(encoding="utf-8"))

          assert "## Required Analytical Narrative" in skill
          assert "references/technical-analysis.md" in skill
          assert (root / "references/technical-analysis.md").is_file()
          assert "## 2. Explanation contract" in template
          assert not re.search(r"[\u3400-\u4dbf\u4e00-\u9fff]", agents)

          technical = next(item for item in signals["signals"] if item["id"] == "technical_state")
          assert technical["family"] == "cross_asset_positioning"
          assert "long" not in technical["horizons"]
          print("analysis contracts ok")
          PY
